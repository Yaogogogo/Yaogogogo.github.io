<script>
function filterModels(){
    const selMajor = document.getElementById('selMajor').value;
    const selPrice = document.getElementById('selPrice').value;
    const allCards = document.querySelectorAll('.model-card');
    let resultHtml = "";
    allCards.forEach(card=>{
        const m = card.dataset.major;
        const p = card.dataset.price;
        let show = true;
        if(selMajor !== 'all' && m !== selMajor) show = false;
        if(selPrice !== 'all' && p !== selPrice) show = false;
        if(show){
            resultHtml += card.outerHTML;
        }
    });
    const box = document.getElementById('filterResult');
    if(resultHtml){
        box.innerHTML = resultHtml;
    }else{
        box.innerHTML = "<div class='p-4 bg-gray-100 rounded-lg'>暂无匹配机型，请更换筛选条件</div>";
    }
}
</script>
